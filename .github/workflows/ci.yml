name: CI - Docker y GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Definir nombre de imagen
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Construir imagen Docker
        run: docker build -t dds-devops-demo:test .

      - name: Verificar funcionamiento
        run: |
          docker run -d --name web-test \
            -p 127.0.0.1:8080:80 \
            dds-devops-demo:test
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8080/ | grep -q "Hola DevOps"; then
              echo "Prueba exitosa"
              exit 0
            fi
            sleep 1
          done
          docker logs web-test
          exit 1

      - name: Autenticarse en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Autenticarse en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Etiquetar imagen para ambos registros
        run: |
          SHA="${GITHUB_SHA::7}"
          GHCR="${{ steps.image.outputs.name }}"
          DOCKERHUB="martinaristia/dds-devops"

          docker tag dds-devops-demo:test "$GHCR:$SHA"
          docker tag dds-devops-demo:test "$GHCR:latest"

          docker tag dds-devops-demo:test "$DOCKERHUB:$SHA"
          docker tag dds-devops-demo:test "$DOCKERHUB:latest"

      - name: Publicar imagen en GHCR
        run: |
          SHA="${GITHUB_SHA::7}"
          GHCR="${{ steps.image.outputs.name }}"

          docker push "$GHCR:$SHA"
          docker push "$GHCR:latest"

      - name: Publicar imagen en Docker Hub
        run: |
          SHA="${GITHUB_SHA::7}"
          DOCKERHUB="martinaristia/dds-devops"

          docker push "$DOCKERHUB:$SHA"
          docker push "$DOCKERHUB:latest"
